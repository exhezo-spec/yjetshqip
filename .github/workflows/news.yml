name: Lajmet (çdo orë)

on:
  schedule:
    - cron: "17 * * * *"      # çdo orë, minuta 17
  workflow_dispatch:          # mund ta nisësh edhe me dorë nga GitHub

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser anthropic

      - name: Merr dhe shkruaj lajmet në shqip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit nëse ka ndryshime
        run: |
          git config user.name "yjetshqip-bot"
          git config user.email "bot@yjetshqip.site"
          git add data/news.json lajme sitemap-lajme.xml
          git diff --cached --quiet && echo "Asnjë lajm i ri" && exit 0
          git commit -m "lajme: përditësim automatik $(date -u +'%Y-%m-%d %H:%M')"
          git push
